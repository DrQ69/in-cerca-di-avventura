name: ICA baseline QA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ica-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run structural baseline QA
        run: python scripts/qa_baseline.py

      - name: Run creative canonical consistency
        run: python scripts/creative_consistency_check.py

      - name: Run CR1 vertical slice gate
        run: python scripts/vertical_slice_check.py

      - name: Run M12 technical baseline
        run: python scripts/technical_baseline.py
