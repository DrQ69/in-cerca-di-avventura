name: Temporary E02 snapshot capture

on:
  push:
    branches:
      - feature/sorcery-results-ui-v1-20261011
    paths:
      - '.github/workflows/sorcery-e02-snapshot-temp.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture E02 normalized snapshot
        run: |
          mkdir -p qa/evidence/reports
          node scripts/import_sorcery_event.mjs cmua2gkxc00090agm7qvfrh45 --compare --output qa/evidence/reports/cmua2gkxc00090agm7qvfrh45.json 2>&1 | tee qa/evidence/reports/cmua2gkxc00090agm7qvfrh45.log
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sorcery-e02-snapshot
          path: qa/evidence/reports/cmua2gkxc00090agm7qvfrh45.*
