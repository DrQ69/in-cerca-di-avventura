name: Alleanze visual QA

on:
  pull_request:
    paths:
      - 'beta/alleanze/**'
      - 'data/alliances.json'
      - 'data/map-italia-calibration.json'
      - 'assets/alleanze/**'
      - 'assets/logo-emblem.webp'
      - 'assets/css/ica-shared-shell.css'
      - 'scripts/alleanze_visual_regression.mjs'
      - 'scripts/alliances_geo_audit.mjs'
      - '.github/workflows/alleanze-visual-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'beta/alleanze/**'
      - 'data/alliances.json'
      - 'assets/alleanze/**'
      - 'assets/logo-emblem.webp'
      - 'assets/css/ica-shared-shell.css'
      - 'scripts/alleanze_visual_regression.mjs'
      - '.github/workflows/alleanze-visual-qa.yml'

permissions:
  contents: read

concurrency:
  group: alleanze-visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit geographic calibration
        run: node scripts/alliances_geo_audit.mjs
      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/ica-http.log 2>&1 &
          sleep 2
      - name: Capture and verify Alleanze
        run: node scripts/alleanze_visual_regression.mjs
      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alleanze-visual-qa-${{ github.sha }}
          path: artifacts/alleanze-visual/
          if-no-files-found: error
          retention-days: 14
