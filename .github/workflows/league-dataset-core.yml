name: Sprint 1 league dataset core
on:
  pull_request:
    paths:
      - 'scripts/league-release-core.mjs'
      - 'scripts/league-xlsx-intake-core.mjs'
      - 'tests/league-xlsx-intake-core.test.mjs'
      - 'tests/sprint2-league-model.test.mjs'
      - 'beta/adunanze/nazionale/league-model.mjs'
      - 'scripts/league-release-dry-run.mjs'
      - 'scripts/league-release-audit.mjs'
      - 'scripts/league-build-private-candidate.mjs'
      - 'scripts/league-private-preview.mjs'
      - 'scripts/league-preview-private.mjs'
      - 'tests/league-release-core.test.mjs'
      - 'tests/league-release-integration.test.mjs'
      - 'tests/league-release-current-data.test.mjs'
      - 'tests/league-private-preview.test.mjs'
      - 'tests/league-release-network.test.mjs'
      - 'tests/league-release-audit.test.mjs'
      - 'tests/league-private-candidate.test.mjs'
      - 'data/players.json'
      - 'data/events.json'
      - 'data/league-standings.json'
      - 'beta/shared/release-reader.mjs'
      - 'beta/main.js'
      - 'beta/avventurieri/avventurieri.js'
      - 'beta/adunanze/nazionale/main.js'
      - 'beta/cronache/main.js'
      - 'docs/ICA_RELEASE_AUDIT_LOG.schema.json'
      - '.github/workflows/league-dataset-core.yml'
  workflow_dispatch:
jobs:
  node-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: >
          node --test
          tests/league-release-core.test.mjs
          tests/league-release-integration.test.mjs
          tests/league-release-current-data.test.mjs
          tests/league-private-preview.test.mjs
          tests/league-release-network.test.mjs
          tests/league-release-audit.test.mjs
          tests/league-private-candidate.test.mjs
          tests/league-xlsx-intake-core.test.mjs
          tests/sprint2-league-model.test.mjs
