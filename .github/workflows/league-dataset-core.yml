name: Sprint 1 league dataset core
on:
  pull_request:
    paths:
      - 'scripts/league-release-core.mjs'
      - 'tests/league-release-core.test.mjs'
      - '.github/workflows/league-dataset-core.yml'
  workflow_dispatch:
jobs:
  node-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/league-release-core.test.mjs
