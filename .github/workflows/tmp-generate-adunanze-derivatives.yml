name: TEMP generate Adunanze responsive images

on:
  push:
    branches:
      - qa/adunanze-performance-review

permissions:
  contents: write

concurrency:
  group: temp-adunanze-derivatives
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: qa/adunanze-performance-review

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Generate responsive WebP derivatives
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          items = [
              ("assets/adunanze/adunanze-battlefield.webp", "assets/adunanze/adunanze-battlefield-512.webp", 512),
              ("assets/adunanze/adunanze-gate-international.webp", "assets/adunanze/adunanze-gate-international-512.webp", 512),
              ("assets/adunanze/adunanze-gate-national.webp", "assets/adunanze/adunanze-gate-national-512.webp", 512),
          ]

          for src, dest, width in items:
              image = Image.open(src).convert("RGB")
              height = round(image.height * width / image.width)
              image = image.resize((width, height), Image.Resampling.LANCZOS)
              image.save(dest, "WEBP", quality=72, method=6)
              print(dest, Path(dest).stat().st_size)
          PY

      - name: Commit generated derivatives when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/adunanze/*-512.webp
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Assets: add Adunanze responsive derivatives"
          git push origin HEAD:qa/adunanze-performance-review
