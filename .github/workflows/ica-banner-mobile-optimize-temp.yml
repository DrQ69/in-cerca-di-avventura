name: Temporary ICA banner mobile optimization

on:
  push:
    branches:
      - release/ica-v1-root-and-governance-20261017
    paths:
      - '.github/workflows/ica-banner-mobile-optimize-temp.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create mobile WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src='assets/banners/navigation/bnr-beta-nav-primary.png'
          out='assets/banners/navigation/bnr-beta-nav-mobile.webp'
          im=Image.open(src).convert('RGB')
          target_w=960
          target_h=round(im.height*target_w/im.width)
          im=im.resize((target_w,target_h),Image.Resampling.LANCZOS)
          im.save(out,'WEBP',quality=80,method=6)
          print(out, im.size)
          PY
          ls -lh assets/banners/navigation/bnr-beta-nav-mobile.webp
      - name: Commit optimized asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banners/navigation/bnr-beta-nav-mobile.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add optimized mobile ICA banner asset"
          git push origin HEAD:${{ github.ref_name }}
